<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Concierge IA — mensagens prontas para anfitriões | Praia Digital</title><meta name="description" content="Gerador de mensagens de concierge para anfitriões de temporada: check-in, boas-vindas, regras e avaliação."><link rel="canonical" href="https://praia.digital/concierge-ia/"><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f8fafc;color:#0f172a;line-height:1.6}.hero{background:linear-gradient(135deg,#0c4a6e,#0ea5e9);color:#fff;padding:60px 20px;text-align:center}.container{max-width:780px;margin:auto;padding:30px 20px}.card{background:#fff;border-radius:13px;padding:24px;margin-bottom:16px;box-shadow:0 3px 10px #0001}label{display:block;font-weight:600;margin:12px 0 4px}input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;box-sizing:border-box}button{background:#0ea5e9;color:#fff;border:0;padding:14px 28px;border-radius:10px;font-size:1.1rem;font-weight:700;cursor:pointer;width:100%;margin-top:16px}textarea{width:100%;min-height:220px;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font-size:.95rem;box-sizing:border-box}a.app{color:#0c4a6e;font-weight:600}footer{text-align:center;padding:24px;color:#64748b}</style></head><body><header class="hero"><h1>🤖 Concierge IA</h1><p>Mensagens profissionais de anfitrião em segundos — check-in, boas-vindas, regras e avaliação.</p></header><main class="container"><div class="card"><label>Nome do imóvel</label><input id="nome" value="Apartamento Vista Mar"><label>Cidade</label><input id="cidade" value="Guarujá"><label>Tipo de mensagem</label><select id="tipo"><option value="boasvindas">Boas-vindas (após reserva)</option><option value="checkin">Instruções de check-in</option><option value="regras">Regras da casa</option><option value="checkout">Check-out e avaliação</option></select><button onclick="gerar()">Gerar mensagem</button></div><div class="card" id="out" style="display:none"><textarea id="msg" readonly></textarea><button onclick="navigator.clipboard.writeText(document.getElementById('msg').value);this.textContent='✅ Copiado!'">Copiar mensagem</button></div><div class="card"><strong>Complete a gestão:</strong><br>🔑 <a class="app" href="https://praia.digital/area-anfitriao/">Área do Anfitrião</a> — gestão completa<br>✅ <a class="app" href="https://praia.digital/checklist-anfitriao/">Checklist do Anfitrião</a> — nada esquecido<br>✍️ <a class="app" href="https://praia.digital/gerador-descricoes/">Gerador de Descrições</a> — anúncio campeão</div></main><footer><a class="app" href="https://praia.digital/apps/">🌐 Apps Praia Digital</a> · <a class="app" href="https://praia.digital/">praia.digital</a></footer><script>function gerar(){var n=document.getElementById('nome').value,c=document.getElementById('cidade').value,t=document.getElementById('tipo').value;var m={boasvindas:'Olá! 🌊 Seja muito bem-vindo(a) ao '+n+' em '+c+'!\n\nSua reserva está confirmada e já estamos preparando tudo com carinho. Em breve enviarei as instruções de check-in.\n\nEnquanto isso, dicas rápidas de '+c+': chegue cedo nos fins de semana (o trânsito da descida é intenso) e aproveite o pôr do sol na praia!\n\nQualquer dúvida, estou à disposição. 😊',checkin:'Check-in do '+n+' 🗝️\n\n📍 Endereço: [endereço completo]\n🕒 Horário: a partir das 15h\n🔐 Acesso: [porteira/lockbox/smart lock — código enviado no dia]\n🚗 Vaga de garagem: [número]\n\nAo chegar, me envie uma mensagem para confirmar. Bem-vindo(a) a '+c+'!',regras:'Regras do '+n+' 🏖️\n\n1. Check-in 15h · Check-out 11h\n2. Proibido fumar dentro do imóvel\n3. Silêncio após 22h (lei do condomínio)\n4. Não levar móveis/utensílios para a praia\n5. Churrasqueira: limpar após o uso\n\nObrigado por cuidar do nosso cantinho em '+c+'! 💙',checkout:'Foi um prazer recebê-lo(a) no '+n+'! 🌟\n\nCheck-out até 11h: deixe as chaves [local], desligue o ar-condicionado e feche as janelas.\n\nSe puder, sua avaliação 5 estrelas ajuda muito! E volte sempre a '+c+' — temos condições especiais para hóspedes que retornam. 😊'};document.getElementById('out').style.display='block';document.getElementById('msg').value=m[t];}</script></body></html>
